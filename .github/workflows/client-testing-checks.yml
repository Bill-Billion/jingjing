name: 甲方测试工具检查
on:
  pull_request:
    branches: [integration]
    paths: ['scripts/client-testing/**', '.github/workflows/client-testing-checks.yml']
  push:
    branches: ['core/**']
    paths: ['scripts/client-testing/**', '.github/workflows/client-testing-checks.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/client-testing/portal.test.cjs
