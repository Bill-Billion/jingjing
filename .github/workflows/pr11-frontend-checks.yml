name: App 与管理网页业务页面检查

on:
  push:
    branches: [integration, main, 'core/**', 'ux/**']
    paths:
      - '晶晶日上工程交接包/01_源码/frontend_ops_workspace/**'
      - '晶晶日上工程交接包/01_源码/frontend_jingjingshangri_app/**'
      - '.github/workflows/pr11-frontend-checks.yml'
      - 'scripts/pr11-ui-test-server.cjs'
      - 'scripts/pr13-ui-test-server.cjs'
      - 'scripts/pr14-ui-test-server.cjs'
      - 'scripts/pr14-ui-browser-check.mjs'
      - 'scripts/pr15-ui-test-server.cjs'
      - 'scripts/pr15-ui-browser-check.mjs'
      - 'scripts/pr15-app-browser-check.mjs'
      - 'scripts/pr17-ui-test-server.cjs'
      - 'scripts/pr17-ui-browser-check.mjs'
      - 'scripts/pr17-app-browser-check.mjs'
      - 'scripts/pr19-app-browser-check.mjs'
      - 'scripts/pr19-ui-browser-check.mjs'
      - 'scripts/pr19-ui-test-server.cjs'
      - 'scripts/pr20-app-browser-check.mjs'
      - 'scripts/pr20-ui-browser-check.mjs'
      - 'scripts/pr20-ui-test-server.cjs'
      - 'scripts/pr18-app-browser-check.mjs'
      - 'scripts/pr18-ui-browser-check.mjs'
      - 'scripts/pr18-ui-test-server.cjs'
      - 'scripts/pr16-ui-test-server.cjs'
      - 'scripts/pr16-ui-browser-check.mjs'
      - 'scripts/pr16-app-browser-check.mjs'
  pull_request:
    branches: [integration, main, 'core/**']
    paths:
      - '晶晶日上工程交接包/01_源码/frontend_ops_workspace/**'
      - '晶晶日上工程交接包/01_源码/frontend_jingjingshangri_app/**'
      - '.github/workflows/pr11-frontend-checks.yml'
      - 'scripts/pr11-ui-test-server.cjs'
      - 'scripts/pr13-ui-test-server.cjs'
      - 'scripts/pr14-ui-test-server.cjs'
      - 'scripts/pr14-ui-browser-check.mjs'
      - 'scripts/pr15-ui-test-server.cjs'
      - 'scripts/pr15-ui-browser-check.mjs'
      - 'scripts/pr15-app-browser-check.mjs'
      - 'scripts/pr17-ui-test-server.cjs'
      - 'scripts/pr17-ui-browser-check.mjs'
      - 'scripts/pr17-app-browser-check.mjs'
      - 'scripts/pr19-app-browser-check.mjs'
      - 'scripts/pr19-ui-browser-check.mjs'
      - 'scripts/pr19-ui-test-server.cjs'
      - 'scripts/pr20-app-browser-check.mjs'
      - 'scripts/pr20-ui-browser-check.mjs'
      - 'scripts/pr20-ui-test-server.cjs'
      - 'scripts/pr18-app-browser-check.mjs'
      - 'scripts/pr18-ui-browser-check.mjs'
      - 'scripts/pr18-ui-test-server.cjs'
      - 'scripts/pr16-ui-test-server.cjs'
      - 'scripts/pr16-ui-browser-check.mjs'
      - 'scripts/pr16-app-browser-check.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: 网页构建与真实接口浏览器检查
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: 晶晶日上工程交接包/01_源码/frontend_ops_workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: 晶晶日上工程交接包/01_源码/frontend_ops_workspace/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:contracts
      - run: npm run test:supply
      - run: npm run test:licensing
      - run: npm run test:trade
      - run: npm run test:gigs
      - run: npm run test:production
      - run: npm run test:projects
      - run: npm run test:finance
      - run: npm run test:operations
      - run: npm run build
      - name: 安装浏览器及隔离接口测试依赖
        run: |
          npx playwright-core install --with-deps chromium
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          npm --prefix ../backend_server ci --no-audit --no-fund
      - name: 启动一次性测试数据库
        working-directory: ${{ github.workspace }}
        run: node scripts/ci-mysql.cjs start
      - name: 用真实账号接口检查页面（仅短信模拟）
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          JX_MYSQL_TEST_ENV_FILE: ${{ github.workspace }}/.local/ci-mysql/test-env.json
          PR11_UI_STATE_FILE: ${{ github.workspace }}/.local/pr11-ui-runtime.json
          VITE_BACKEND_ORIGIN: http://127.0.0.1:3220
          BASE_URL: http://127.0.0.1:5199
        run: |
          node scripts/pr11-ui-test-server.cjs --test-only > .local/pr11-api.log 2>&1 &
          api_pid=$!
          npm --prefix 晶晶日上工程交接包/01_源码/frontend_ops_workspace run dev -- --host 127.0.0.1 --port 5199 --strictPort > .local/pr11-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$api_pid" "$vite_pid" 2>/dev/null || true; wait "$api_pid" "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if test -f "$PR11_UI_STATE_FILE" && curl --fail --silent http://127.0.0.1:5199/ > /dev/null; then break; fi
            sleep 1
          done
          test -f "$PR11_UI_STATE_FILE"
          cd 晶晶日上工程交接包/01_源码/frontend_ops_workspace
          export CHROME_PATH="$(node --input-type=module -e 'import {chromium} from "playwright-core"; console.log(chromium.executablePath())')"
          npm run e2e
      - name: 用真实许可接口检查选本、核验、项目与阅稿页面
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          JX_MYSQL_TEST_ENV_FILE: ${{ github.workspace }}/.local/ci-mysql/test-env.json
          PR14_UI_STATE_FILE: ${{ github.workspace }}/.local/pr14-ui-runtime.json
          VITE_BACKEND_ORIGIN: http://127.0.0.1:3242
          BASE_URL: http://127.0.0.1:5202
        run: |
          node scripts/pr14-ui-test-server.cjs --test-only > .local/pr14-api.log 2>&1 &
          api_pid=$!
          npm --prefix 晶晶日上工程交接包/01_源码/frontend_ops_workspace run dev -- --host 127.0.0.1 --port 5202 --strictPort > .local/pr14-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$api_pid" "$vite_pid" 2>/dev/null || true; wait "$api_pid" "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if test -f "$PR14_UI_STATE_FILE" && curl --fail --silent http://127.0.0.1:5202/ > /dev/null; then break; fi
            sleep 1
          done
          test -f "$PR14_UI_STATE_FILE"
          export CHROME_PATH="$(node -e 'const {createRequire}=require("node:module"); const r=createRequire(process.cwd()+"/晶晶日上工程交接包/01_源码/frontend_ops_workspace/package.json"); console.log(r("playwright-core").chromium.executablePath())')"
          node scripts/pr14-ui-browser-check.mjs
      - name: 用真实交易接口检查报价、付款、退款与历史依据页面
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          JX_MYSQL_TEST_ENV_FILE: ${{ github.workspace }}/.local/ci-mysql/test-env.json
          PR15_WEB_URL: http://127.0.0.1:5203
          VITE_BACKEND_ORIGIN: http://127.0.0.1:3262
        run: |
          node scripts/pr15-ui-test-server.cjs --test-only > .local/pr15-api.log 2>&1 &
          api_pid=$!
          npm --prefix 晶晶日上工程交接包/01_源码/frontend_ops_workspace run dev -- --host 127.0.0.1 --port 5203 --strictPort > .local/pr15-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$api_pid" "$vite_pid" 2>/dev/null || true; wait "$api_pid" "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if test -f .local/pr15-ui-runtime.json && curl --fail --silent http://127.0.0.1:5203/ > /dev/null; then break; fi
            sleep 1
          done
          test -f .local/pr15-ui-runtime.json
          export CHROME_PATH="$(node -e 'const {createRequire}=require("node:module"); const r=createRequire(process.cwd()+"/晶晶日上工程交接包/01_源码/frontend_ops_workspace/package.json"); console.log(r("playwright-core").chromium.executablePath())')"
          node scripts/pr15-ui-browser-check.mjs
      - name: 用真实商单、MCN关系与收退款记录检查网页
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          JX_MYSQL_TEST_ENV_FILE: ${{ github.workspace }}/.local/ci-mysql/test-env.json
          PR17_WEB_URL: http://127.0.0.1:5205
          VITE_BACKEND_ORIGIN: http://127.0.0.1:3302
        run: |
          node scripts/pr17-ui-test-server.cjs --test-only > .local/pr17-api.log 2>&1 &
          api_pid=$!
          npm --prefix 晶晶日上工程交接包/01_源码/frontend_ops_workspace run dev -- --host 127.0.0.1 --port 5205 --strictPort > .local/pr17-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$api_pid" "$vite_pid" 2>/dev/null || true; wait "$api_pid" "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if test -f .local/pr17-ui-runtime.json && curl --fail --silent http://127.0.0.1:5205/ > /dev/null; then break; fi
            sleep 1
          done
          test -f .local/pr17-ui-runtime.json
          export CHROME_PATH="$(node -e 'const {createRequire}=require("node:module"); const r=createRequire(process.cwd()+"/晶晶日上工程交接包/01_源码/frontend_ops_workspace/package.json"); console.log(r("playwright-core").chromium.executablePath())')"
          node scripts/pr17-ui-browser-check.mjs
      - name: 用真实制作接口检查版本、独立审片、反馈与受控交付
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          JX_MYSQL_TEST_ENV_FILE: ${{ github.workspace }}/.local/ci-mysql/test-env.json
          PR16_WEB_URL: http://127.0.0.1:5205
          VITE_BACKEND_ORIGIN: http://127.0.0.1:3282
        run: |
          node scripts/pr16-ui-test-server.cjs --test-only > .local/pr16-api.log 2>&1 &
          api_pid=$!
          npm --prefix 晶晶日上工程交接包/01_源码/frontend_ops_workspace run dev -- --host 127.0.0.1 --port 5205 --strictPort > .local/pr16-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$api_pid" "$vite_pid" 2>/dev/null || true; wait "$api_pid" "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if test -f .local/pr16-ui-runtime.json && curl --fail --silent http://127.0.0.1:5205/ > /dev/null; then break; fi
            sleep 1
          done
          if ! test -f .local/pr16-ui-runtime.json; then
            cat .local/pr16-api.log
            cat .local/pr16-vite.log
            exit 1
          fi
          export CHROME_PATH="$(node -e 'const {createRequire}=require("node:module"); const r=createRequire(process.cwd()+"/晶晶日上工程交接包/01_源码/frontend_ops_workspace/package.json"); console.log(r("playwright-core").chromium.executablePath())')"
          node scripts/pr16-ui-browser-check.mjs
      - name: 用真实项目接口检查选角、准确会签、独立核验与发行事实
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          JX_MYSQL_TEST_ENV_FILE: ${{ github.workspace }}/.local/ci-mysql/test-env.json
          PR18_WEB_URL: http://127.0.0.1:5207
          VITE_BACKEND_ORIGIN: http://127.0.0.1:3322
        run: |
          node scripts/pr18-ui-test-server.cjs --test-only > .local/pr18-api.log 2>&1 &
          api_pid=$!
          npm --prefix 晶晶日上工程交接包/01_源码/frontend_ops_workspace run dev -- --host 127.0.0.1 --port 5207 --strictPort > .local/pr18-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$api_pid" "$vite_pid" 2>/dev/null || true; wait "$api_pid" "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if test -f .local/pr18-ui-runtime.json && curl --fail --silent http://127.0.0.1:5207/ > /dev/null; then break; fi
            sleep 1
          done
          if ! test -f .local/pr18-ui-runtime.json; then
            cat .local/pr18-api.log
            cat .local/pr18-vite.log
            exit 1
          fi
          export CHROME_PATH="$(node -e 'const {createRequire}=require("node:module"); const r=createRequire(process.cwd()+"/晶晶日上工程交接包/01_源码/frontend_ops_workspace/package.json"); console.log(r("playwright-core").chromium.executablePath())')"
          node scripts/pr18-ui-browser-check.mjs
      - name: 用真实财务接口检查约定、结算、实付、收入与争议
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          JX_MYSQL_TEST_ENV_FILE: ${{ github.workspace }}/.local/ci-mysql/test-env.json
          PR19_WEB_URL: http://127.0.0.1:5209
          VITE_BACKEND_ORIGIN: http://127.0.0.1:3342
        run: |
          node scripts/pr19-ui-test-server.cjs --test-only > .local/pr19-api.log 2>&1 &
          api_pid=$!
          npm --prefix 晶晶日上工程交接包/01_源码/frontend_ops_workspace run dev -- --host 127.0.0.1 --port 5209 --strictPort > .local/pr19-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$api_pid" "$vite_pid" 2>/dev/null || true; wait "$api_pid" "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if test -f .local/pr19-ui-runtime.json && curl --fail --silent http://127.0.0.1:5209/ > /dev/null; then break; fi
            sleep 1
          done
          if ! test -f .local/pr19-ui-runtime.json; then
            cat .local/pr19-api.log
            cat .local/pr19-vite.log
            exit 1
          fi
          export CHROME_PATH="$(node -e 'const {createRequire}=require("node:module"); const r=createRequire(process.cwd()+"/晶晶日上工程交接包/01_源码/frontend_ops_workspace/package.json"); console.log(r("playwright-core").chromium.executablePath())')"
          node scripts/pr19-ui-browser-check.mjs
      - name: 用真实通知、留言、审计和报表接口检查网页
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          JX_MYSQL_TEST_ENV_FILE: ${{ github.workspace }}/.local/ci-mysql/test-env.json
          PR20_WEB_URL: http://127.0.0.1:5211
          VITE_BACKEND_ORIGIN: http://127.0.0.1:3362
        run: |
          node scripts/pr20-ui-test-server.cjs --test-only > .local/pr20-api.log 2>&1 &
          api_pid=$!
          npm --prefix 晶晶日上工程交接包/01_源码/frontend_ops_workspace run dev -- --host 127.0.0.1 --port 5211 --strictPort > .local/pr20-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$api_pid" "$vite_pid" 2>/dev/null || true; wait "$api_pid" "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if test -f .local/pr20-ui-runtime.json && curl --fail --silent http://127.0.0.1:5211/ > /dev/null; then break; fi
            sleep 1
          done
          if ! test -f .local/pr20-ui-runtime.json; then
            cat .local/pr20-api.log
            cat .local/pr20-vite.log
            exit 1
          fi
          export CHROME_PATH="$(node -e 'const {createRequire}=require("node:module"); const r=createRequire(process.cwd()+"/晶晶日上工程交接包/01_源码/frontend_ops_workspace/package.json"); console.log(r("playwright-core").chromium.executablePath())')"
          node scripts/pr20-ui-browser-check.mjs
      - name: 清理本次测试数据库
        if: always()
        working-directory: ${{ github.workspace }}
        run: node scripts/ci-mysql.cjs stop
  app:
    name: App 账号合同作品许可交易商单测试与网页构建
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 晶晶日上工程交接包/01_源码/frontend_jingjingshangri_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 获取固定版本 Flutter 工具
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git flutter
          test "$(git -C flutter rev-parse HEAD)" = '6a19cca56475dbfba1478ee68d7bd0c2ef891da1'
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          flutter/bin/flutter config --no-analytics
      - run: flutter pub get --enforce-lockfile
      - run: dart analyze lib/account lib/contracts lib/supply lib/licensing lib/trade lib/gigs lib/production lib/projects lib/finance lib/operations lib/navigation lib/app.dart lib/main.dart lib/pages/login/login_page.dart lib/pages/splash/splash_page.dart lib/widgets/main_scaffold.dart test/account test/contracts test/supply test/licensing test/trade test/gigs test/production test/projects test/finance test/operations test/navigation
      - run: flutter test test/account test/contracts test/supply test/licensing test/trade test/gigs test/production test/projects test/finance test/operations test/navigation test/interaction_flows_test.dart test/widget_test.dart
      - name: 检查完整 App 可以生成网页发布文件
        run: flutter build web --no-pub
