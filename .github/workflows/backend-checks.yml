name: 服务器自动检查

on:
  push:
    branches: [integration, main, 'core/**', 'ux/**']
  pull_request:
    branches: [integration, main, 'core/**', 'ux/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  independent:
    name: 无需数据库的接口格式与权限规则检查
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 获取本次代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 准备 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
      - name: 离线检查配置缺项和凭证不外泄
        run: python3 scripts/provider_config_audit_test.py
      - name: 单独检查账号权限规则
        run: node scripts/backend-check.cjs party-unit
      - name: 安装锁定版本的接口检查工具
        run: |
          python3 -m venv .local/contract-venv
          .local/contract-venv/bin/python -m pip install -r contracts/requirements-lock.txt
      - name: 检查接口格式和示例（不调用服务器）
        run: .local/contract-venv/bin/python scripts/validate_contract.py
  backend:
    name: 数据库、后台任务和服务器功能
    runs-on: ubuntu-24.04
    # 31 suites plus 35 HTTP contract reports; measured duplicate run exceeded 15 minutes.
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: 获取本次代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 准备 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: 晶晶日上工程交接包/01_源码/backend_server/package-lock.json
      - name: 检查原始资料和任务记录
        run: python3 scripts/collaboration_check.py
      - name: 按锁定版本安装服务器依赖
        working-directory: 晶晶日上工程交接包/01_源码/backend_server
        run: npm ci --no-audit --no-fund
      - name: 准备真实视频处理检查工具
        timeout-minutes: 8
        run: |
          # Hosted runners often already contain these tools. Verify before touching apt.
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null || [ ! -r /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
            # The Azure mirror stalled this job; keep Ubuntu's signed packages on its main mirror.
            for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
              if [ -f "$source" ]; then
                sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$source"
              fi
            done
            apt_options=(-o Acquire::ForceIPv4=true -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
            # Use existing package indexes first; an unrelated repository must not hang the whole job.
            if ! timeout 180s sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg fonts-dejavu-core; then
              timeout 120s sudo apt-get "${apt_options[@]}" update
              timeout 180s sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg fonts-dejavu-core
            fi
          fi
          ffmpeg -version
          ffprobe -version
          test -r /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          node scripts/check-data-governance.cjs
      - name: 启动一次性测试数据库
        run: node scripts/ci-mysql.cjs start
      - name: 运行检查并保存结果
        working-directory: 晶晶日上工程交接包/01_源码/backend_server
        env:
          JX_MYSQL_TEST_ENV_FILE: ${{ github.workspace }}/.local/ci-mysql/test-env.json
          JX_TEST_FFMPEG: /usr/bin/ffmpeg
          JX_TEST_FFPROBE: /usr/bin/ffprobe
          JX_TEST_FONT: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
        run: npm run test:ci
      - name: 校验真实隔离HTTP返回与接口文档一致
        run: |
          python3 -m venv .local/contract-venv
          .local/contract-venv/bin/python -m pip install -r contracts/requirements-lock.txt
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/account-api-http-fixtures.json --report .local/ci-evidence/runtime-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/stock-http-fixtures.json --report .local/ci-evidence/stock-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/notices-http-fixtures.json --report .local/ci-evidence/notices-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/auditions-http-fixtures.json --report .local/ci-evidence/auditions-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/wallet-http-fixtures.json --report .local/ci-evidence/wallet-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/engagement-http-fixtures.json --report .local/ci-evidence/engagement-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/artists-http-fixtures.json --report .local/ci-evidence/artists-runtime-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/customization-delivery-http-fixtures.json --report .local/ci-evidence/customization-delivery-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/customization-http-fixtures.json --report .local/ci-evidence/customization-runtime-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/customization-quote-http-fixtures.json --report .local/ci-evidence/customization-quote-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/marketplace-http-fixtures.json --report .local/ci-evidence/marketplace-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/governance-http-fixtures.json --report .local/ci-evidence/governance-runtime-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/governance-service-http-fixtures.json --report .local/ci-evidence/governance-service-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/supply-http-fixtures.json --report .local/ci-evidence/supply-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/licensing-http-fixtures.json --report .local/ci-evidence/licensing-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/trade-http-fixtures.json --report .local/ci-evidence/trade-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/production-http-fixtures.json --report .local/ci-evidence/production-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/projects-http-fixtures.json --report .local/ci-evidence/projects-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/gigs-http-fixtures.json --report .local/ci-evidence/gigs-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/finance-http-fixtures.json --report .local/ci-evidence/finance-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/operations-http-fixtures.json --report .local/ci-evidence/operations-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/cocreation-http-fixtures.json --report .local/ci-evidence/cocreation-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/participation-http-fixtures.json --report .local/ci-evidence/participation-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/redemption-http-fixtures.json --report .local/ci-evidence/redemption-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/redemption-checkout-http-fixtures.json --report .local/ci-evidence/redemption-checkout-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/redemption-lottery-http-fixtures.json --report .local/ci-evidence/redemption-lottery-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/manual-sample-http-fixtures.json --report .local/ci-evidence/manual-sample-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/script-intake-http-fixtures.json --report .local/ci-evidence/script-intake-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/project-income-http-fixtures.json --report .local/ci-evidence/project-income-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/participation-amendment-http-fixtures.json --report .local/ci-evidence/participation-amendment-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/fixed-income-release-http-fixtures.json --report .local/ci-evidence/fixed-income-release-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/privacy-http-fixtures.json --report .local/ci-evidence/privacy-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/privacy-actions-http-fixtures.json --report .local/ci-evidence/privacy-actions-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/seven-privacy-http.json --report .local/ci-evidence/privacy-execution-contract.json
          .local/contract-venv/bin/python scripts/validate_contract.py --runtime-fixtures .local/seven-media-http.json --report .local/ci-evidence/media-contract.json
      - name: 关闭并移除本次测试数据库
        if: always()
        run: node scripts/ci-mysql.cjs stop
      - name: 保存测试记录（不含数据库或口令）
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ci-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
