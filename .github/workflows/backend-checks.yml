name: 服务器自动检查

on:
  push:
    branches: [integration, main, 'core/**', 'ux/**']
  pull_request:
    branches: [integration, main, 'core/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 数据库、后台任务和服务器功能
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: 获取本次代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 准备 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: 晶晶日上工程交接包/01_源码/backend_server/package-lock.json
      - name: 检查原始资料和任务记录
        run: python3 scripts/collaboration_check.py
      - name: 按锁定版本安装服务器依赖
        working-directory: 晶晶日上工程交接包/01_源码/backend_server
        run: npm ci --no-audit --no-fund
      - name: 启动一次性测试数据库
        run: node scripts/ci-mysql.cjs start
      - name: 运行检查并保存结果
        working-directory: 晶晶日上工程交接包/01_源码/backend_server
        env:
          JX_MYSQL_TEST_ENV_FILE: ${{ github.workspace }}/.local/ci-mysql/test-env.json
        run: npm run test:ci
      - name: 关闭并移除本次测试数据库
        if: always()
        run: node scripts/ci-mysql.cjs stop
      - name: 保存测试记录（不含数据库或口令）
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/ci-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
