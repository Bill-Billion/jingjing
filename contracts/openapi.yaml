openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: 晶选片场 R0.6 Platform Foundation API
  version: 0.3.0-rc.1
  description: Account API and private historical content read candidate. Isolated verification only; real SMS,
    business source writers and front-end integration remain unverified.
servers:
- url: http://127.0.0.1:3000
  description: Account API development entry; requires explicit MySQL configuration, applied migrations and secret.
    Not a production service.
security:
- bearerAuth: []
tags:
- name: session
- name: party
- name: identity
- name: capabilities
- name: providers
- name: governance
- name: operations
x-baseline-id: JX-R06-EXECUTION-BASELINE-20260921
x-review-status: PENDING_EXPERIENCE_REVIEW
paths:
  /api/v1/auth/sms-challenges:
    post:
      operationId: createSmsChallenge
      summary: 请求登录短信
      description: No production dev-code fallback. Provider unavailable ->503, rate limit ->429. A retry with the
        same key must not resend SMS. New challenge creation invalidates only by explicitly documented server policy.
      tags:
      - session
      x-implementation-status: IMPLEMENTED_ISOLATED_TESTS
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Success; only after real validation/committed work.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsChallengeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsChallengeRequest'
  /api/v1/auth/sessions:
    post:
      operationId: createSession
      summary: 验证码登录
      description: Bind challenge to normalized phone, expiry, one-time consumption and attempts. Invalid phone/challenge/code
        yields generic401 to resist enumeration. Commit challenge consumption + session + idempotency result atomically.
        Exact successful retry may return the original protected token result until session/result expiry; never
        mint a second session. No refresh or token storage policy implied.
      tags:
      - session
      x-implementation-status: IMPLEMENTED_ISOLATED_TESTS
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Success; only after real validation/committed work.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
  /api/v1/me:
    get:
      operationId: getCurrentAccount
      summary: 当前登录账户
      description: Bearer identity only; acting_party=null. Phone login is not real-name verification. A suspended
        account may read its own status but has only server-allowed actions.
      tags:
      - session
      x-implementation-status: IMPLEMENTED_ISOLATED_TESTS
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Success; only after real validation/committed work.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/me/parties:
    get:
      operationId: listMyParties
      summary: 可访问主体与成员关系
      description: Only caller memberships. Invitations may be displayed but do not confer action authority. Select
        party client-side and send X-Acting-Party per request; do not mutate a global selected party in the bearer
        token.
      tags:
      - party
      x-implementation-status: IMPLEMENTED_ISOLATED_TESTS
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Success; only after real validation/committed work.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/parties/{party_id}:
    get:
      operationId: getParty
      summary: 主体详情
      description: Require active membership or explicit audited delegation. Route/header mismatch ->403; inaccessible
        private object ->404. Capabilities do not imply verified identity.
      tags:
      - party
      x-implementation-status: IMPLEMENTED_ISOLATED_TESTS
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ActingParty'
      - $ref: '#/components/parameters/party_id'
      responses:
        '200':
          description: Success; only after real validation/committed work.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      operationId: updatePartyDisplayName
      summary: 更新主体展示名称
      description: Only party.profile.update may change display_name. This is not legal-name/identity change or
        party transfer. Every successful new mutation increments object_version exactly once. Same idempotent request
        replays original result without a new increment. Do not use a read-time allowed_actions list instead of
        server authorization.
      tags:
      - party
      x-implementation-status: IMPLEMENTED_ISOLATED_TESTS
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ActingParty'
      - $ref: '#/components/parameters/party_id'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Success; only after real validation/committed work.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyPatch'
  /api/v1/identity-verifications/current:
    get:
      operationId: getMyIdentityVerification
      summary: 本人核验状态
      description: Account-scoped; no X-Acting-Party, no arbitrary account_id. This slice reads status only. Submission/liveness
