      security: []
  /ready:
    get:
      operationId: getReadiness
      summary: 必要运行依赖就绪
      description: 200 only when required process dependencies are ready. 503 NOT_READY uses the same ReadyResponse;
        no detailed topology. Unapproved optional Provider does not disable process readiness.
      tags:
      - operations
      x-implementation-status: IMPLEMENTED_ISOLATED_TESTS
