            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/parties/{party_id}:
    get:
      operationId: getParty
      summary: 主体详情
      description: Require active membership or explicit audited delegation. Route/header mismatch ->403; inaccessible
        private object ->404. Capabilities do not imply verified identity.
      tags:
      - party
      x-implementation-status: IMPLEMENTED_ISOLATED_TESTS
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ActingParty'
      - $ref: '#/components/parameters/party_id'
      responses:
        '200':
          description: Success; only after real validation/committed work.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    patch:
      operationId: updatePartyDisplayName
      summary: 更新主体展示名称
      description: Only party.profile.update may change display_name. This is not legal-name/identity change or
        party transfer. Every successful new mutation increments object_version exactly once. Same idempotent request
        replays original result without a new increment. Do not use a read-time allowed_actions list instead of
        server authorization.
      tags:
      - party
      x-implementation-status: IMPLEMENTED_ISOLATED_TESTS
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ActingParty'
      - $ref: '#/components/parameters/party_id'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Success; only after real validation/committed work.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartyPatch'
  /api/v1/identity-verifications/current:
    get:
      operationId: getMyIdentityVerification
      summary: 本人核验状态
      description: Account-scoped; no X-Acting-Party, no arbitrary account_id. This slice reads status only. Submission/liveness
