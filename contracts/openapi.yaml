components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Server-validated account identity, issuer/audience/expiry/revocation. Account token alone does
        not authorize acting_party or platform administration.
  parameters:
    RequestId:
      in: header
      name: X-Request-Id
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
      description: Optional correlation hint; server validates or replaces. Response header must equal meta.request_id.
        Do not use for idempotency.
    ActingParty:
      in: header
      name: X-Acting-Party
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      description: Requested subject, not authority. Resolve bearer account and active membership/delegation on
        every call. Path party_id must equal this header. Never silently select a different party.
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
      description: idempotency_key. Scope=(account or pre-auth subject, acting_party, method, canonical path, key).
        Persist normalized request fingerprint and committed result atomically. Same payload replays original result;
        changed payload/in-flight conflict gives 409. Re-authorize before replay; never include secrets in fingerprint
        logs.
    IfMatch:
      in: header
      name: If-Match
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
      description: Strong ETag containing object_version, e.g. "7". Missing ->428; stale new write ->412. Same successful
        idempotent request can replay with its original If-Match; check authorized replay before current object-version
        mismatch.
    Cursor:
      in: query
      name: cursor
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 512
      description: Opaque, subject/filter-scoped cursor; do not decode on client. Invalid/expired cursor returns
        400.
    Limit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    party_id:
      in: path
      name: party_id
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    rule_version_id:
      in: path
      name: rule_version_id
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    snapshot_id:
      in: path
      name: snapshot_id
      required: true
      schema:
        $ref: '#/components/schemas/Id'
  headers:
    RequestId:
      required: true
      description: Matches meta.request_id
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ETag:
      required: true
      description: Strong quoted object_version
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
    NoStore:
      required: true
      description: Authenticated, token and private metadata responses are not cacheable.
      schema:
        type: string
        const: no-store
  responses:
    BadRequest:
      description: VALIDATION_ERROR / INVALID_CURSOR / PARTY_CONTEXT_REQUIRED
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: UNAUTHENTICATED / SESSION_EXPIRED / INVALID_CHALLENGE
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: FORBIDDEN / PARTY_CONTEXT_MISMATCH
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: NOT_FOUND (also concealed inaccessible private objects)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: IDEMPOTENCY_KEY_REUSED / IDEMPOTENCY_IN_PROGRESS
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionFailed:
      description: OBJECT_VERSION_CONFLICT
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: BUSINESS_RULE_VIOLATION
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionRequired:
      description: OBJECT_VERSION_REQUIRED
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: RATE_LIMITED
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          description: Optional bounded wait hint in seconds; does not authorize blind retry of a mutation.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: CAPABILITY_NOT_READY / DEPENDENCY_UNAVAILABLE
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          description: Optional bounded wait hint in seconds; does not authorize blind retry of a mutation.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
      description: Opaque ID; clients must not assume sequential numeric storage IDs.
    ObjectVersion:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    Money:
      type: object
      additionalProperties: false
      required:
      - amount_minor
      - currency
      properties:
        amount_minor:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        currency:
          type: string
          pattern: ^[A-Z]{3}$
      description: Non-negative integer minor units and ISO 4217 code. Currency exponent comes from currency metadata,
        never assume every currency has 2 decimals. Adjustments use a separate direction, not negative transaction
        prices. No approved product price is supplied.
    Actor:
      type: object
      additionalProperties: false
      required:
      - account_id
      properties:
        account_id:
          $ref: '#/components/schemas/Id'
    Meta:
      type: object
      additionalProperties: false
      required:
      - request_id
      - actor
      - acting_party
      properties:
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        actor:
          anyOf:
          - $ref: '#/components/schemas/Actor'
          - type: 'null'
        acting_party: &id004
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      description: Server-derived actor; null before authentication. acting_party is null for account-scoped/public
        calls. Never trust a client actor field.
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - field
      - reason
      properties:
        field:
          type: string
          maxLength: 128
        reason:
          type: string
          maxLength: 256
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - retryable
      - details
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        message:
          type: string
          minLength: 1
          maxLength: 500
        retryable:
          type: boolean
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - meta
      - error
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        error:
          $ref: '#/components/schemas/Error'
    Account:
      type: object
      additionalProperties: false
      required:
      - id
      - display_name
      - current_status
      - object_version
      - allowed_actions
      properties:
        id:
          $ref: '#/components/schemas/Id'
        display_name:
          type: string
          minLength: 1
          maxLength: 80
        current_status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - DELETION_PENDING
        object_version:
          $ref: '#/components/schemas/ObjectVersion'
        allowed_actions: &id002
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 100
          uniqueItems: true
          description: Server-authorized action identifiers for this actor, party, object and current state. Never
            a client authorization source.
    CapabilityGrant:
      type: object
      additionalProperties: false
      required:
      - code
      - current_status
      - allowed_actions
      properties:
        code:
          type: string
          enum:
          - AUTHOR
          - SCRIPT_SUPPLIER
          - PRODUCER
          - MCN
          - BRAND_CLIENT
        current_status:
          type: string
          enum:
          - PENDING_REVIEW
          - ACTIVE
          - SUSPENDED
          - REJECTED
        allowed_actions: *id002
    Party:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - display_name
      - current_status
      - object_version
      - capabilities
      - allowed_actions
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          enum:
          - PERSON
          - ORGANIZATION
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        current_status:
          type: string
          enum:
          - PENDING_REVIEW
          - ACTIVE
          - SUSPENDED
          - CLOSED
        object_version:
          $ref: '#/components/schemas/ObjectVersion'
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityGrant'
        allowed_actions: *id002
      description: Party is a signing/business subject, not an account or avatar. One organization may hold multiple
        capabilities; a person may be an author.
    Membership:
      type: object
      additionalProperties: false
      required:
      - id
      - account_id
      - party_id
      - current_status
      - roles
      - object_version
      - allowed_actions
      properties:
        id:
          $ref: '#/components/schemas/Id'
        account_id:
          $ref: '#/components/schemas/Id'
        party_id:
          $ref: '#/components/schemas/Id'
        current_status:
          type: string
          enum:
          - INVITED
          - ACTIVE
          - SUSPENDED
          - REVOKED
        roles:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          uniqueItems: true
        object_version:
          $ref: '#/components/schemas/ObjectVersion'
        allowed_actions: *id002
      description: Invitation is not consent or an active membership. Client role strings never grant platform administration.
    PartyAccess:
      type: object
      additionalProperties: false
      required:
      - party
      - membership
      properties:
        party:
          $ref: '#/components/schemas/Party'
        membership:
          $ref: '#/components/schemas/Membership'
    PartyPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PartyAccess'
        next_cursor:
          type:
          - string
          - 'null'
          maxLength: 512
    SmsChallengeRequest:
      type: object
      additionalProperties: false
      required:
      - phone
      - purpose
      properties:
        phone:
          type: string
          pattern: ^1[3-9][0-9]{9}$
        purpose:
          type: string
          enum:
          - LOGIN
      description: First slice retains mainland mobile scope of legacy route; never accepts a client-supplied verification
        result.
    SmsChallenge:
      type: object
      additionalProperties: false
      required:
      - challenge_id
      - current_status
      - expires_at
      - resend_after
      properties:
        challenge_id:
          $ref: '#/components/schemas/Id'
        current_status:
          type: string
          enum:
          - SENT
        expires_at: &id003
          type: string
          format: date-time
        resend_after: *id003
      description: SENT only after the SMS provider accepts dispatch; not proof of delivery or identity. No verification
        code in response. Missing provider returns 503.
    SessionRequest:
      type: object
      additionalProperties: false
      required:
      - challenge_id
      - phone
      - code
      properties:
        challenge_id:
          $ref: '#/components/schemas/Id'
        phone:
          type: string
          pattern: ^1[3-9][0-9]{9}$
        code:
          type: string
          pattern: ^[0-9]{6}$
          writeOnly: true
    Session:
      type: object
      additionalProperties: false
      required:
      - access_token
      - token_type
      - expires_at
      - account
      properties:
        access_token:
          type: string
          minLength: 1
          description: Secret bearer token. Never log or include real values in fixtures.
        token_type:
          type: string
          enum:
          - Bearer
        expires_at: *id003
        account:
          $ref: '#/components/schemas/Account'
    PartyPatch:
      type: object
      additionalProperties: false
      required:
      - display_name
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 120
    IdentityVerification:
      type: object
      additionalProperties: false
      required:
      - current_status
      - verification_id
      - verified_at
      - allowed_actions
      properties:
        current_status:
          type: string
          enum:
          - NOT_SUBMITTED
          - PENDING
          - VERIFIED
          - REJECTED
          - EXPIRED
          - REVOKED
          - REVIEW_REQUIRED
        verification_id: *id004
        verified_at: &id005
          anyOf:
          - *id003
          - type: 'null'
        allowed_actions: *id002
      description: Only VERIFIED with recorded evidence enables a verified-identity claim. Legacy unverified_auto
        maps to REVIEW_REQUIRED, never VERIFIED. No raw identity number, name, face or provider credentials.
      allOf:
      - if:
          properties:
            current_status:
              const: VERIFIED
        then:
          properties:
            verification_id:
              $ref: '#/components/schemas/Id'
            verified_at: *id003
    BusinessCapability:
      type: object
      additionalProperties: false
      required:
      - code
      - availability
      - reason_code
      - display_message
      - allowed_actions
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
        availability:
          type: string
          enum:
          - AVAILABLE
          - NOT_ENABLED
          - TEMPORARILY_UNAVAILABLE
        reason_code:
          type:
          - string
          - 'null'
          maxLength: 100
        display_message:
          type: string
          maxLength: 300
        allowed_actions: *id002
      description: Client-facing effective availability includes product, permissions, rules and required environment
        verification, not merely Provider configuration. Unknown action is disabled.
      allOf:
      - if:
          properties:
            availability:
              enum:
              - NOT_ENABLED
              - TEMPORARILY_UNAVAILABLE
        then:
          properties:
            allowed_actions:
              maxItems: 0
            reason_code:
              type: string
              minLength: 1
              maxLength: 100
    CapabilityList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BusinessCapability'
    ProviderReadinessState:
      type: string
      enum:
      - NOT_IMPLEMENTED
      - IMPLEMENTED
      - CONFIGURED
      - SANDBOX_VERIFIED
      - PRODUCTION_VERIFIED
      - WAITING_PROVIDER_APPROVAL
      - DISABLED_BY_PRODUCT
    VerificationEvidence:
      type: object
      additionalProperties: false
      required:
      - verified_state
      - environment
      - verified_at
      - evidence_ref
      properties:
        verified_state:
          type: string
          enum:
          - SANDBOX_VERIFIED
          - PRODUCTION_VERIFIED
        environment:
          type: string
          enum:
          - LOCAL
          - SANDBOX
          - PRODUCTION
        verified_at: *id003
        evidence_ref:
          $ref: '#/components/schemas/Id'
      description: Opaque reference accessible only through separately authorized audit evidence access; never a
        raw private URL.
      allOf:
      - if:
          properties:
            verified_state:
              const: PRODUCTION_VERIFIED
        then:
          properties:
            environment:
              const: PRODUCTION
      - if:
          properties:
            verified_state:
              const: SANDBOX_VERIFIED
        then:
          properties:
            environment:
              const: SANDBOX
    ProviderReadiness:
      type: object
      additionalProperties: false
      required:
      - provider_kind
      - provider_code
      - capability_code
      - environment
      - current_status
      - object_version
      - reason_code
      - verification_history
      - allowed_actions
      properties:
        provider_kind:
          type: string
          enum:
          - IdentityProvider
          - PaymentProvider
          - ObjectStorageProvider
          - ModerationProvider
          - DigitalHumanProvider
          - ESignProvider
          - SmsProvider
        provider_code:
          type: string
          minLength: 1
          maxLength: 100
        capability_code:
          type: string
          minLength: 1
          maxLength: 100
        environment:
          type: string
          enum:
          - LOCAL
          - SANDBOX
          - PRODUCTION
        current_status:
          $ref: '#/components/schemas/ProviderReadinessState'
        object_version:
          $ref: '#/components/schemas/ObjectVersion'
        reason_code:
          type:
          - string
          - 'null'
          maxLength: 100
        verification_history:
          type: array
          items:
            $ref: '#/components/schemas/VerificationEvidence'
        allowed_actions: *id002
      description: Waiting/disabled preserves verification history but does not grant current enablement. Separate
        rows per provider/product capability/environment. A sandbox check is never evidence of production verification.
      allOf:
      - if:
          properties:
            current_status:
              const: PRODUCTION_VERIFIED
        then:
          properties:
            environment:
              const: PRODUCTION
            verification_history:
              contains:
                type: object
                required:
                - verified_state
                - environment
                properties:
                  verified_state:
                    const: PRODUCTION_VERIFIED
                  environment:
                    const: PRODUCTION
    ProviderReadinessPage:
