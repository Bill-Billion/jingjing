      - if:
          properties:
            current_status:
              const: PRODUCTION_VERIFIED
        then:
          properties:
            environment:
              const: PRODUCTION
            verification_history:
              contains:
                type: object
                required:
                - verified_state
                - environment
                properties:
                  verified_state:
                    const: PRODUCTION_VERIFIED
                  environment:
                    const: PRODUCTION
