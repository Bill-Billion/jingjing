          maxLength: 512
    RuleVersion:
      type: object
      additionalProperties: false
      required:
      - id
      - rule_key
      - version
      - current_status
      - object_version
      - effective_at
      - content_asset_id
      - content_sha256
      - allowed_actions
      properties:
        id:
          $ref: '#/components/schemas/Id'
        rule_key:
          type: string
          minLength: 1
          maxLength: 100
        version:
          type: string
          minLength: 1
          maxLength: 64
        current_status:
          type: string
          enum:
          - DRAFT
          - IN_REVIEW
          - APPROVED
          - EFFECTIVE
          - RETIRED
        object_version:
          $ref: '#/components/schemas/ObjectVersion'
        effective_at: *id005
        content_asset_id:
          $ref: '#/components/schemas/Id'
        content_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        allowed_actions: *id002
      description: Immutable approved content addressed by private asset/hash; drafts stay unavailable to transactions.
        Historical versions remain readable to entitled orders/parties even after retirement. Actual rule documents
        and unknown product specifications are not invented by this contract.
      allOf:
      - if:
          properties:
            current_status:
              const: EFFECTIVE
        then:
          properties:
            effective_at: *id003
    ContractSnapshot:
      type: object
      additionalProperties: false
      required:
      - id
      - contract_version_id
      - rule_version_ids
      - party_ids
      - created_at
      - object_version
      - current_status
      - content_asset_id
      - content_sha256
      - signing_method
      - signing_evidence_refs
      - allowed_actions
      properties:
        id:
          $ref: '#/components/schemas/Id'
        contract_version_id:
          $ref: '#/components/schemas/Id'
        rule_version_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          minItems: 1
          uniqueItems: true
        party_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          minItems: 1
          uniqueItems: true
        created_at: *id003
        object_version:
          type: integer
          const: 1
        current_status:
          type: string
          enum:
          - SEALED
        content_asset_id:
          $ref: '#/components/schemas/Id'
        content_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        signing_method:
          type: string
          enum:
          - PLATFORM_ESIGN
          - EXTERNAL_ESIGN
          - OFFLINE_SIGNED
          - NOT_SIGNED
        signing_evidence_refs:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          uniqueItems: true
        allowed_actions: *id002
      description: Read-only immutable contract snapshot metadata, not proof of signature/payment or a full order
        schema. SEALED means content captured. Signing facts are frozen at capture; new evidence requires a new
        snapshot/version, never overwriting old promises. NOT_SIGNED cannot activate a license. Full monetary/specification/refund/rights
        snapshots will be expanded with commerce/licensing contracts.
      allOf:
      - if:
          properties:
            signing_method:
              const: NOT_SIGNED
        then:
          properties:
            signing_evidence_refs:
              maxItems: 0
        else:
          properties:
            signing_evidence_refs:
              minItems: 1
