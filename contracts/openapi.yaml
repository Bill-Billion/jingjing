openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: 晶选片场 R0.6 Platform Foundation API
  version: 0.5.0-rc.1
  description: Account, contract, supply and licensing API candidate. Isolated verification only; real providers and front-end integration remain unverified.
servers:
- url: http://127.0.0.1:3000
  description: Account API development entry; requires explicit MySQL configuration, applied migrations and secret.
    Not a production service.
security:
- bearerAuth: []
tags:
- name: supply
- name: session
- name: party
- name: identity
- name: capabilities
- name: providers
- name: governance
- name: operations
x-baseline-id: JX-R06-EXECUTION-BASELINE-20260921
x-review-status: PENDING_EXPERIENCE_REVIEW
paths:
  /api/v1/auth/sms-challenges:
    post:
      operationId: createSmsChallenge
      summary: 请求登录短信
      description: No production dev-code fallback. Provider unavailable ->503, rate limit ->429. A retry with the
        same key must not resend SMS. New challenge creation invalidates only by explicitly documented server policy.
      tags:
      - session
      x-implementation-status: IMPLEMENTED_ISOLATED_TESTS
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Success; only after real validation/committed work.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsChallengeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmsChallengeRequest'
  /api/v1/auth/sessions:
    post:
      operationId: createSession
      summary: 验证码登录
      description: Bind challenge to normalized phone, expiry, one-time consumption and attempts. Invalid phone/challenge/code
        yields generic401 to resist enumeration. Commit challenge consumption + session + idempotency result atomically.
        Exact successful retry may return the original protected token result until session/result expiry; never
        mint a second session. No refresh or token storage policy implied.
      tags:
      - session
      x-implementation-status: IMPLEMENTED_ISOLATED_TESTS
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Success; only after real validation/committed work.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRequest'
  /api/v1/me:
    get:
      operationId: getCurrentAccount
      summary: 当前登录账户
      description: Bearer identity only; acting_party=null. Phone login is not real-name verification. A suspended
        account may read its own status but has only server-allowed actions.
      tags:
      - session
      x-implementation-status: IMPLEMENTED_ISOLATED_TESTS
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Success; only after real validation/committed work.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/me/parties:
    get:
      operationId: listMyParties
      summary: 可访问主体与成员关系
      description: Only caller memberships. Invitations may be displayed but do not confer action authority. Select
        party client-side and send X-Acting-Party per request; do not mutate a global selected party in the bearer
        token.
      tags:
      - party
      x-implementation-status: IMPLEMENTED_ISOLATED_TESTS
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Success; only after real validation/committed work.
          headers:
            X-Request-Id:
