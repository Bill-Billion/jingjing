<script type="application/json" id="execution-docs">{"backend": {"title": "后端执行指令", "filename": "04_后端执行指令.txt", "text": "你负责晶晶日上后端。收到本包后，按一个连续目标推进：把当前主要后端交成前端可操作的接入基线，持续解决实际联调阻断，并按已获准产品准备真实服务接入。不再以穷尽所有潜在边角为开始前端联调的条件；不把后端全部剩余工作缩成“给接口文档”。\n\n先读README、02、03、07和当前仓库的AGENTS、START_HERE、CORE_CURRENT、任务板、有效需求、contracts/openapi.yaml、implementation.json及BACKEND_INTEGRATION_HANDOFF_20261115.md。本包PM03调整的是本轮顺序和分工，保留原业务范围与151验收要求。发现AGENTS中的旧“前端仅UI/停止前端接入”文字，在原入口说明已由本轮用户指示调整；不据此接管前端源码或改变生产安全限制。\n\n【起点】\n本轮核验候选c1d750b4d87d20c0bd1a17a7d53b9c614bad9ed4，接口0.31.78-rc.11、迁移0225，PR39仍草稿；integration为468df28a。先核实际HEAD与本地未提交内容。HEAD变化要核差异，不引用旧CI冒充新版本通过。不要回旧main、硬重置或覆盖任何队友成果。\n\n【第一交付：可用环境，不是更多报告】\n1. 依现有工具准备固定候选、限时隔离库/服务与可读写测试文件；记录实际访问方式、有效期、启动停止、重置步骤和负责人。完整后端测试会清库，其临时编号不能直接交前端续用。\n2. 按首批现货、通告准备买家、艺人、供给/制作、机构员工、运营与独立审核等实际需要的角色；每人具备对应有效合成实名、权限、授权和已审资料。负例单独准备，不批量设所有人合格；没有全能测试账号。\n3. 准备已审现货、许可、规则、文件、普通发布策略和投稿资料。身份/支付/存储等外部模拟只能在测试环境，业务仍真实落库。传递凭据只用受控渠道，不写文档/日志/看板。\n4. 前端做一次登录、读取和最小写入，确认记录能在所需运营角色中找到。完成后标记具体G项和原W01/W10，不假称12条全部环境就绪。\n5. 当前网页PR15卖方创建规格返回409 VERIFIED_ADULT_REQUIRED；PR17历史买方前提也待复验。后端说明精确前提并处理本侧环境/helper；前端主办其网页测试准备脚本。若查实运行时缺陷由你修复。不得关闭身份准入、删负例、增加无依据收费或只加超时。复验受影响段和被跳过业务。\n\n【交出环境后，不停止，也不继续无限审库】\n按队列连续做：资金/越权/隐私/数据破坏风险 → 当前业务阻断 → 下一条业务所需的角色/资料/接口说明 → 同批普通缺陷和受影响回归 → 有产品材料与授权的外部接入准备。\n前端等待的接口问题立即定位；查测试资料/配置、页面调用、业务行为和规则依据。没有具体反例时不宣布新漏洞，也不无边界扩字段、建第二套引擎或重复已有主链。\n每个接口补丁只改查实范围；给出准确commit、契约/迁移变化、受影响操作、前端需做什么、保留的拒绝场景及实际复验。重要契约变化先通知前端；本批无关功能冻结，但不是冻结必要修复。\n\n【怎样与前端持续前进】\n前端主办页面和跨端操作。你负责接口/数据并做另一侧复核，不要求其全部UI定稿。以现货与普通发布开始，随后定制/试镜/商单、机构隐私、共创/权益/发行。每条任务引用原W/E2E/ACC；真实服务条件未满足单列，不阻塞不相关隔离接入。\n修复后先跑受影响范围；进入共同版本时跑仓库规定的必要检查。别为每个文字调整循环全量回归，也不能为了节省时间省掉共享钱账/权限变更应有的回归。\n一条完成即复核并进入下一条。没有必要每轮询问能否继续。当前项受阻则记录最后缺项并切换安全的下一项；真正无可做项就给明确阻断，不用空跑和复制报告维持轮次。\n\n【记录与权限】\n只更新自己的CORE_CURRENT、原任务板和相关证据；不得用后端报告覆盖EXPERIENCE_CURRENT。原151项已满足的后端专属项交另一人真实复核，不无条件等全平台；跨端/真实条件不能降低。\n阶段输出只写：已交付/已修复、准确版本、实际检查、未解决阻断、下一动作。证据放一份再引用，不新建平行正式任务板。\n不自动强推、合PR39、部署或启用真实收费/公网；不动既有3490/离线APK。维护者必要检查与审阅后按实际授权处理共同版本。真实资金、生产、破坏性数据操作或重大规则冲突暂停对应动作取得授权，其余已授权本侧开发继续。\n项目总览不更新，自动监测不恢复。看板便签不是正式验收结果。\n"}, "frontend": {"title": "前端执行指令", "filename": "05_前端执行指令.txt", "text": "你负责晶晶日上的Flutter App与管理网页。当前用户已要求从“仅UI改造”转向既有业务的大范围接入和连续联调。目标不是重新生成所有页面，而是用已重塑页面和已有组件，将现有后端变成用户可以完整办理的产品。接手后在自己的CURRENT和原任务板记录实际认领，不需要每做完一个操作再等待新指令。\n\n先读README、02、03、07；读取仓库AGENTS、有效需求及后续变更、当前接口和implementation.json、已确认原型/UI、BACKEND_INTEGRATION_HANDOFF_20261115.md。原151验收预期保留。旧材料中的“仅UI/后端等全部审完再接入”不再作为本轮前端工作限制；不据此扩大到真实收费、部署、主接口或数据库修改。\n\n【保护现有成果】\n先列实际分支/HEAD、本地未提交和未上传UI、App与网页构建、已接和未接操作。不要硬重置，不从旧main开新功能，不为追上候选覆盖UI工作。本轮后端基线c1d750b4d87d20c0bd1a17a7d53b9c614bad9ed4、接口0.31.78-rc.11/0225；PR39草稿、integration468df28a。实际HEAD有变化先查差异。先在保留成果的任务工作树中整合已约定候选，必要审阅后再进入共同分支。\n\n【接入所需输入】\n当前有效需求说明办什么；接口说明如何读写；已有UI说明如何展示；环境和角色说明如何实际验证。接口不是页面清单，不要一接口造一页。需求与实现冲突登记，不能自行删规则或在页面计算最终金额、权限和许可。\n后端完整测试结束会清库；不要拿其临时账号/订单当常驻资料。接收有有效期的隔离环境、测试角色、规则及实际文件后，先用最小业务验证可用。环境未就绪时可整理接法/组件/状态，但只能记页面准备，不可写已联调。\n\n【第一批具体动作】\n1. 主办当前网页测试准备修复，和后端共同核PR15正常卖方、PR17正常买方身份前提。修改前确认测试脚本所有权。只补正常资料或修本侧接法，保留无权、未实名、未成年、过期和重放反例；运行受影响段及后续检查。后端行为有缺陷交后端处理，不关准入、不直接改库伪造通过。\n2. 现货：商品/许可→下单→隔离付款→解锁→实际播放下载→售后；运营审核和退款页也要可操作。退款按审核结果保留或撤销许可，不一律自动收权。\n3. 通告：普通实名艺人无星探资格发非官方通告→运营独审→他人查看投稿→意向和客服。先验证这个切片，继续接报价/订单/商单履约后才能关闭整条E2E-04。\n4. 现有资料副本、机构批量、匹配等组件先核现状再复用，不按“未验收”推断它们未开发。\n\n【持续推进顺序】\n首批现货/通告 → 人工定制/试镜/商单履约 → 机构批量/企业代办/隐私 → 共创/晶钻券/奖品/会员/曝光/参演发行。按03逐条继续；与当前主链相关的基础组件可提前接，不机械等待整批结束。\n同一时间主联调一条业务，最多准备一条不冲突的下一业务；不要12条都停在接了一半。UI可提前一批，不等所有图标字体最终定稿。\n每完成一个操作马上连接真实后端业务代码及隔离数据库验证。后台数据准备不算页面成功，模拟供应商不算真实服务开通。正常业务、拒绝、重复、撤权/状态变化、取消/退款和恢复按原要求测；App/Web/实体设备分别记。\n\n【问题循环】\n记录准确前后端版本、接口、角色、业务编号、操作、预期/实际、必要脱敏响应和证据。先分测试资料/前端调用/后端行为/规则冲突。资金/权限/隐私和当前主链阻断立即处理；非阻断问题同批修。后端给补丁后实际复验，不把“已修复”直接当“页面通过”。\n前端自己的请求、表单、缓存、分页、登录返回、未保存提示、未知结果恢复问题由自己处理。越权、缺规则或钱账的最终裁定交后端/业务依据，不在UI强行放行。\n本条满足条件交另一位开发者复核，原标准能关闭就关闭，再接下一条；缺外部真实条件则保留具体缺项，继续不相关工作。无需每轮等待新指令，不能靠假数据或删验收点提高数字。\n\n【记录与交付】\n仅维护自己的EXPERIENCE_CURRENT、原任务板和本条证据；分清设计完成、页面已接、隔离整链验证、原标准正式通过。导出前后端准确版本、有效期和复跑步骤。UI资源使用许可确认；不要另起一轮全站重设计。\n不改后端主契约/迁移/业务钱账；需要新增接口先提交具体需求映射和缺项。共享测试文件先约定唯一编辑者。不强推、不直接合main或PR39，不部署生产、不接真实收费和公网，不动既有3490/离线APK。维护者必要审阅后按授权合入。\n项目总览不改，不恢复自动监测，不把本地驾驶舱便签当正式验收。\n"}, "ui": {"title": "UI协作说明", "filename": "06_UI协作说明.md", "text": "# UI协作说明\n\n## 目标\n\n在前端已完成的页面重塑基础上统一视觉，支持本轮业务接入，不再另外规划一套产品。设计稿、页面实现、接口接通和业务验证分别记录。\n\n## 优先交付\n\n先确定字体层级、颜色、图标、按钮、表单、选择器、卡片、列表、弹窗和消息提示。每个组件至少区分正常、加载、空数据、字段错误、不可操作、成功和失败；是否展示某种状态由实际业务决定。\n\n首批支持视频商品详情、许可、付款状态、已购/下载、通告卡片、发布表单、审核/投稿结果。随后按定制试镜、机构隐私、共创与权益、发行收入顺序提前一批。\n\nUI可与接入并行。非关键图标、字体细节没有最终确定时，使用已有组件继续接接口；定稿后统一替换。状态含义和必要错误提醒不能留空。\n\n## 交付清单\n\n组件和页面版本、资源名称与格式、字号/间距规则、适配范围、交互状态、已定/待定说明，以及字体图标的使用许可依据。生产文件不附无授权字体；不要将图片中的字当作不可编辑按钮。\n\n## 不能代替的决定\n\n不决定谁能发布、如何收费、何时解锁、是否自动验收、退款金额、授权用途或分成比例。这些以有效需求和后端结果为准。设计与当前规则不符时先指出冲突，不让前端照着漂亮但错误的流程实现。\n\n## 验证\n\n前端每完成一批实际操作后检查可读性、层级、控件状态和一致性。影响理解/误付款/误授权/可访问性的缺陷优先处理；普通美化集中调整，不阻断其他功能接入。\n"}, "rules": {"title": "统一目标与连续推进规则", "filename": "02_统一目标与连续推进规则.md", "text": "# 统一目标与连续推进规则\n\n## 一、当前判断与工作模式\n\n主要后端功能已经具备交给前端集中接续的基础。下一阶段不再把“后端把全部潜在问题排查完”作为前端开工条件，而采用：前端按当前有效需求和现有页面持续接入，后端交付可操作环境并随联调修复，设计提前准备下一批。\n\n当前候选c1d750b4，接口0.31.78-rc.11/0225。后端报告222文件、2334通过、0失败、1项真实旧库缺样本；128份同次HTTP、9624响应格式通过。PR与服务器远端检查已有成功回执；App检查与网页构建成功，网页交易准备仍失败。具体来源见驾驶舱“范围与依据”。这些是准备联调的依据，不是正式上线结论。\n\n## 二、四份输入共同使用\n\n1. **当前有效需求与已确认变更**：决定谁能做什么、哪些规则适用。V5不是孤立的最后依据，后续合同和通告发布变更必须一并核对。\n2. **固定候选的接口与实现清单**：决定方法、字段、权限、状态、错误和真实限制。`contracts/openapi.yaml`与`contracts/implementation.json`同时读，不能仅看到接口名就认为实际供应商已经接通。\n3. **前端现有页面及已确认UI规范**：复用近期重塑成果，不重新生成全站。一个页面可以组合多个接口，不要求一个接口对应一个新页面。\n4. **可用的隔离环境、角色和业务资料**：可以实际办理并保留记录，区分脚本准备与真正页面操作。\n\n需求、接口、设计不一致时，引用冲突点登记并交对应负责人解决。不得为迎合现有代码删需求，不得为了页面效果自行计算最终钱账和授权真值。\n\n## 三、进入接入不等于通过合并或上线\n\n### 可以立即并行的事\n\n前端核自己的工作树、页面及接入差距，按固定接口准备；UI交共用组件和首批状态；后端准备隔离服务、角色、文件、规则和已知失败的合法测试前提。\n\n### 一条业务开始实际联调的条件\n\n本条需要的服务可访问；前后端版本明确；需要的角色、身份、授权、已审规则和资料有效；可以做一次最小动作并核到结果；没有阻断本条的资金、越权或隐私风险。\n\n其他不相关业务的非阻断失败，不必使全体等待。当前网页PR15及PR17的受影响路径必须先排查，不能以跳过或假成功取得本条通过。\n\n### 合入共同版本和正式启用的条件\n\n按仓库要求完成准确候选的必要检查和实际审阅，不绕过失败强行合入。真实服务、签名包、设备、恢复、运营与财务签收保留原条件。开始联调不代表可以部署、收费或对公众开放。\n\n## 四、连续执行循环\n\n**选择原任务 → 核有效需求/接口/已有页面 → 核环境角色 → 接入一个操作 → 立即实际验证 → 记录并归类问题 → 修复/复验 → 完成本条跨端办理 → 对应验收复核 → 进入下一条。**\n\n前端同时深入联调一条主业务，最多再准备一条不冲突的业务；UI可以提前一批。后端先处理当前已复现的高风险和主链阻断，再准备下一条环境资料，之后处理同批普通缺陷及有明确资料的外部服务接入。\n\n任何一方等待时，不需要重复全文扫描或全量跑测来填时间。可切换到不受影响任务；真正无可执行项时写清最后缺项、负责方和继续条件。\n\n## 五、如何处理接口问题\n\n- **资金、权限、隐私、数据损坏**：立即停止受影响危险动作，查根因并修复；不能推迟到前端全部完成后。\n- **正常业务无法继续**：本批优先处理。先核数据和配置，再区分页面调用或接口缺陷；后端修接口，前端修接法。\n- **不阻断的一般问题**：归入原任务，同批集中修复；如果它属于原必测要求，未修前仍不能关闭该项。\n- **视觉微调**：UI统一给定稿，前端集中应用；不阻塞安全可用的接口接入。\n- **真实业务规则冲突**：只暂停受影响动作，提交引用和选择建议；不凭猜测增加收费、权益或合同范围。\n\n“后台运行时修复”与“网页测试资料修复”不是一回事。当前实名失败应恢复正常角色前提，保留未实名、未成年、过期、无权和重放的拒绝检查，不能把所有测试账号默认改为合格。\n\n## 六、版本与合并安排\n\n1. 接手先fetch和查看工作树，不覆盖本地UI重塑、未提交或未上传内容。\n2. 将c1d750b4作为本次交接参考；若远端更新，先核提交/接口/迁移差异和检查结果。前端可在保留自己成果的工作树/任务分支中整合该候选，不从旧main重新开发。\n3. 固定本批版本，后端只发布必要补丁；每次说明影响操作、字段/状态/错误/权限、迁移或配置变化、前端动作和验证结果。\n4. 补丁使用前后端明确的新版本组合，并重新验证受影响范围。不要反复用旧构建跑新接口然后汇总为“同版通过”。\n5. PR39不强推、不由本包自动合并。必要检查及维护者审阅后形成共同版本；后续按可独立验证的较小业务批次提交，避免一个申请长期堆叠。\n\n## 七、进度和原验收分别记录\n\n新增的“后端有接入基础、环境与角色可用、页面已接通、完整办理已验证”是中间进度，不替代原151项标准。原要求包含真实服务、实体机或独立审阅的，必须继续保留。\n\n原本仅要求后端且已满足的项，可以由另一责任人及时复核，不用无限等全站UI。原本要求跨端的项，不能用接口通过替代。通告发布投稿切片完成，不代表通告到商单履约整条路线完成。\n\n看板不直接把工作便签写入原PASS。双方在仓库现有任务板、各自CURRENT和正式验收文件里记录事实，引用一份实际证据，不复制多套总账。\n\n## 八、停止条件与范围保护\n\n遇到真实资金/生产调用、公开服务、破坏性迁移/清库/重置、超出权限的合并、重大商业规则变更，先暂停对应动作并取得必要授权。日常已授权的页面开发、隔离测试及本侧缺陷修复可连续进行。\n\n不动既有3490和离线APK，不把模拟角色或源文件放进正式环境，不在仓库、看板或便签里记录密码、Token、Key和真人敏感资料。限定测试服务的访问、有效期和停止办法；有效期不会自动因计划变化延长。\n\n## 九、本轮完成目标\n\n12条已有业务在所需App/网页/运营角色之间能完整办理，并有原标准要求的正常及关键逆向证据；必要接口问题关闭。真实外部条件和最终发布仍按原要求逐项取得结果，不删范围、不以停用功能冒充交付。\n\n不设置未经测量的总完成率或新的固定上线天数。首批现货与通告实际完成后，按真实页面缺口、联调缺陷和外部待办重新评估剩余工作。\n"}, "records": {"title": "交接记录与补丁规则", "filename": "07_交接记录与补丁规则.md", "text": "# 交接记录与补丁规则\n\n## 一、环境交接：没有填写就不能说已经可用\n\n复用 `data/联调环境交接模板.json`，并把实值归入现有仓库交接记录。不要平行建立新环境管理系统。\n\n|字段|应记录什么|\n|---|---|\n|版本|实际后端commit、接口/迁移版本；前端commit与构建分别记录|\n|访问|实际受控访问方式；前端不能访问远端服务器的127.0.0.1时，用经授权的本地同环境或受控连接，不擅自开公网|\n|期限|环境何时到期、由谁停止；续期需明确，不能因计划文档自动延长|\n|角色|本条需要的买家、艺人、机构、制作、运营、独立审核；权限范围和合成身份前提|\n|资料|已审规则、商品/规格、授权、文件、合同及样例版本；不得作为正式商业默认值|\n|模拟|哪些外部环节是模拟，如何触发失败、等待和重复回执|\n|操作|实际启动、停止、备份、重置方法及影响；重置前协调，不删对方尚待复验的记录|\n|回执|前端实际连接/最小操作结果、日期、测试业务编号、未解决问题|\n\n只记录受控凭据交接位置，不填写密码、短信验证码、API Key、访问Token和真人信息。\n\n## 二、问题记录：先定位，不直接把所有失败归为接口缺陷\n\n沿原W/ACC登记：问题编号、业务链、候选/前端构建、角色、业务编号、预期与实际、复现步骤、必要脱敏响应、证据路径、严重程度、唯一主办、下一动作、修复版本、复验人/结果。\n\n优先判断：测试前提或环境 → 页面调用/参数 → 后端行为 → 需求冲突。归因未确认就写待定位，不为制造进度把静态猜测写成漏洞。\n\n高风险和主链阻断优先；其余同批处理。接口缺字段但前端确无该业务依据时，不自动增加字段。两次重复失败而缺新信息时，停止盲目重试，记录原因并切换下一安全任务。\n\n## 三、补丁交接：每次后端更新前端都能知道影响\n\n至少写清：准确commit、契约/迁移版本、受影响的业务动作、字段/状态/错误/权限变化、是否需要更新配置或数据、前端修改点、回滚影响、测试结果、仍未验证部分。\n\n本批接口原则上稳定，无关功能不混入；必要缺陷仍修。能保持兼容就不破坏旧接法；必须改变时双方先约定再发布。旧订单/合同不追改，新规则按适用版本执行。\n\n前端升级后复验受影响范围，并在同一记录补上结果。后端修复完成不是自动验收通过。大范围共享权限、资金、迁移变化要按仓库要求补充分回归。\n\n## 四、每条业务交付最小证据\n\n- 有效需求和原W/ACC/E2E；引用完整预期，不改分母。\n- 后端候选、前端源码与构建、接口/规则/数据版本。\n- 参与角色、实际业务编号、准备脚本做了什么、页面做了什么。\n- 正常办理、原要求逆向/拒绝/重复/恢复结果。\n- 文件实际下载/字节、金额和权利结果等本条需要的核对。\n- 已知缺陷、真实服务/设备/独立审阅等尚缺条件。\n- 实际复核人、结论及证据路径。\n\n不要把不同记录或不同版本的局部成功随意拼成整链；版本差异若确无影响须说明可复用依据。\n\n## 五、状态分别记录\n\n“后端有接入基础”“环境与角色可用”“页面已接通”“完整办理已验证”是工作状态。只有原正式登记按完整条件更新后，才能称“原标准正式通过”。端侧、供应商或独立审阅未完成，不能因为工作状态向前就把PARTIAL改PASS。\n\n看板允许写入本地工作便签及导入导出；便签不触发仓库更新，也不改变上方正式统计。标记为验证完成时必须附证据和复核人；其他候选的记录只作为历史查看，不能移用到当前版本。\n\n## 六、如何同步而不增加文档负担\n\n各自更新自己的CURRENT：正在做哪条、已交什么、最后阻断、下一动作。任务板与正式验收只引用一份证据。每完成一条业务或一批必要补丁集中交接；无需每轮生成一套新的报告和副本。\n\n阶段末由用户发起远端复核和驾驶舱更新。项目总览不在本轮维护；没有自动后台监测。\n"}, "boundary": {"title": "核验范围与使用边界", "filename": "09_核验范围与使用边界.md", "text": "# 核验范围与使用边界\n\n本轮日期：2026年11月15日。\n\n## 实际读取\n\n上传的PM02 ZIP及其中说明、原任务索引、驾驶舱数据、HTML生成与测试脚本；当前GitHub PR39；固定c1d750b4的后端联调交接；该候选App/Web工作流的两任务与步骤。\n\n## 记录来源\n\nPR39：候选、共同版本、接口/迁移、服务器和工具检查回执、2334/0/1与9624响应结果、19/124/8及18组未关闭、真实服务限制。\n\n固定交接：12条接口域/测试路径、临时测试结束清库、前端接续后另备限时资料。\n\nApp/Web工作流：App成功；网页交易准备失败；后续10个业务步骤跳过。具体409和PR15归因描述取当前PR正文；本轮没有下载完整日志或本地重现根因。\n\nPM02/PM01：原30任务、12路线、18组和121个范围要点。它们是继承索引，不冒充重新遍历审查全部源码或151项细则。\n\n## 本轮新增的内容\n\n三方连续推进安排、环境交接清单、分级修复队列、接入次序、工作便签和补丁交接为本轮产品管理设计。它们与源文件事实分开展示，不是新商业条款，不代表双方已认领。\n\n## 未执行的操作\n\n未运行项目业务测试或真实供应商；未读取密钥；未更改代码、正式任务状态或原验收登记；未合并、部署、收费、公开测试站；未恢复自动监测；未更新项目总览。\n\n本包自检仅验证HTML生成、页面、筛选、详情、便签及导入导出，详见qa。页面检查不能替代业务系统验收。HTML不自动同步GitHub；采用本地记录时应导出并按正式流程归档。\n\n本轮没有提供新工期承诺。环境实际交付且首批两条流程验证后，再依据真实缺口估算剩余工作。\n\n## 页面自检结果\n\n73项页面与交互检查通过：准确候选与原计数、桌面/手机布局、业务与任务筛选、原任务详情、指令下载、环境模板、便签校验、导出/导入/去重/冲突拒绝、内容转义、历史候选标记和打印样式。\n\n本环境的浏览器管理员策略阻止file://导航，因此采用set_content载入实际HTML全文完成检查；未验证操作系统双击打开和跨重开持久保存。无本地存储时的会话回退与导出导入已验证。此限制只涉及本次页面检查环境，不代表文件包含线上依赖。\n"}}</script>

'use strict';
const D=JSON.parse(document.getElementById('dashboard-data').textContent);
const DOC=JSON.parse(document.getElementById('execution-docs').textContent);
const tabs=[['home','当前目标'],['ready','接入准备'],['routes','业务推进'],['tasks','双方任务'],['issues','问题与修复'],['acceptance','验收方式'],['services','外部服务'],['records','工作记录'],['scope','范围与依据']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ul=a=>'<ul class="checklist">'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';

const recordKeys=['id','created_at','task_id','route_id','kind','status','priority','owner','candidate_sha','frontend_commit','record_ref','summary','evidence','reviewer','next_action'];
function validateRecord(v){
 if(!v||typeof v!=='object'||Array.isArray(v)||Object.keys(v).some(k=>!recordKeys.includes(k)))throw Error('记录含不支持字段。');
 if(recordKeys.some(k=>typeof v[k]!=='string'||v[k].length>6000))throw Error('记录字段缺失或过长。');
 if(!/^[a-zA-Z0-9-]{8,80}$/.test(v.id)||!Number.isFinite(Date.parse(v.created_at)))throw Error('记录编号或日期无效。');
 if(!D.tasks.some(t=>t.id===v.task_id)||v.route_id&&!D.routes.some(t=>t.id===v.route_id))throw Error('任务或业务编号无效。');
 if(v.route_id&&!D.routes.find(t=>t.id===v.route_id).tasks.split('/').includes(v.task_id)&&!['W01','W02','W08','W09','W10','W23','W24','W25','W26','W27','W28','W29','W30'].includes(v.task_id))throw Error('任务与业务编号不匹配。');
 if(!kinds.includes(v.kind)||!statuses.includes(v.status)||!levels.includes(v.priority)||!roles.includes(v.owner))throw Error('记录类型或状态无效。');
 if(!/^[a-f0-9]{40}$/.test(v.candidate_sha)||v.frontend_commit&&!/^[a-f0-9]{40}$/.test(v.frontend_commit))throw Error('请使用完整的40位提交号。');
 if(!v.summary.trim())throw Error('请填写实际进展或问题。');
 if(v.status==='本条隔离验证通过'&&(!v.evidence.trim()||!v.reviewer.trim()||!v.record_ref.trim()||!v.frontend_commit))throw Error('验证通过需填写前端版本、业务记录、证据及实际复核人。');
 return Object.fromEntries(recordKeys.map(k=>[k,v[k]]));
}

<div class="metrics"><div class="card"><div class="metric-label">原标准通过</div><div class="metric-value">${D.metrics.pass}<span>/151</span></div><div class="metric-foot">按原标准的指定范围</div></div><div class="card"><div class="metric-label">部分验证</div><div class="metric-value">${D.metrics.partial}</div><div class="metric-foot">仍有具体条件待完成</div></div><div class="card"><div class="metric-label">证据不足</div><div class="metric-value">${D.metrics.not_run}</div><div class="metric-foot">不等同完全没有代码</div></div><div class="card"><div class="metric-label">原交付组关闭</div><div class="metric-value">0<span>/18</span></div><div class="metric-foot">本轮不擅改正式结果</div></div></div>
<div class="grid2"><div class="card"><h3>一条业务的最小交付</h3>${ul(['原需求和W/ACC/E2E编号、准确前后端版本。','参与角色、业务记录、实际所需页面。','正常办理及原要求的取消/退款/越权/重复/恢复结果。','实际文件、金额、权利和状态等本条结果核对。','最后缺项、外部条件、复验人和证据位置。'])}</div><div class="card"><h3>避免三种假进度</h3>${ul(['页面使用假数据能点，不等于已接后台。','后端补丁已经提交，不等于页面复验通过。','隔离付款或合成签署通过，不等于真实服务已经接通。'])}<p class="body-note">仅需后端且证据满足的原项可及时独立复核；要求页面、设备或真实服务的项仍保留这些条件。</p></div></div>
<h3 class="section-space">原18组交付检查</h3><div class="table-wrap grow"><table class="wide-table"><thead><tr><th>原组</th><th>完整结果</th><th>正式状态</th></tr></thead><tbody>${D.groups.map(g=>`<tr><td><strong>${esc(g.id)} · ${esc(g.name)}</strong></td><td>${esc(g.exit)}</td><td>${badge('尚未正式关闭','amber')}</td></tr>`).join('')}</tbody></table></div>${source(['R01','R06'])}`;}
function services(){return head('外部服务','与页面接入并行准备，按条件逐项实测','后端并未只剩交接文档。具体产品适配、权限、真实结果、恢复与部署仍是实际工作；未准备好只阻塞对应正式动作。')+`
<div class="notice-muted">昆山资料与OSS后置安排沿现有交接。无需把所有页面停下来等真实服务，也不能把模拟成功或功能关闭当作交付完成。</div><div class="grid2">${D.services.map(s=>`<article class="card"><div class="row-head"><h3>${esc(s.name)}</h3>${badge('真实接通待核验','amber')}</div><p class="small">${esc(s.use)}</p><h4 class="grow">下一步做什么</h4><p>${esc(s.next)}</p><h4 class="grow">需要的材料与条件</h4><p>${esc(s.need)}</p><div class="body-note">${esc(s.owner)}。${esc(s.note)}</div></article>`).join('')}</div>${source(['R01','R02'])}`;}
function recordItems(){return notes.length?notes.slice().reverse().map(n=>`<article class="notes-item"><div class="row-head"><h3>${esc(n.task_id)} · ${esc(n.kind)}</h3><button class="btn no-print" data-remove="${esc(n.id)}">删除本机记录</button></div><div class="tagline">${badge(n.status)}${badge(n.owner)}${n.candidate_sha!==D.meta.sha?badge('其他候选 · 仅历史','amber'):badge('本轮候选','green')}${n.route_id?badge('业务 '+n.route_id):''}</div><p class="grow">${esc(n.summary)}</p><p class="small grow">下一动作：${esc(n.next_action||'未填')}</p><p class="small">证据：${esc(n.evidence||'未填')}　复核：${esc(n.reviewer||'未填')}</p><p class="mono grow">后端 ${esc(n.candidate_sha)}<br>前端 ${esc(n.frontend_commit||'未填')}<br>业务记录 ${esc(n.record_ref||'未填')}</p><small>${esc(n.created_at)}</small></article>`).join(''):'<div class="empty">尚未记录本机工作。填写后导出交接，再按仓库正式流程归档。</div>';}
function records(){return head('工作记录','记录真实进展，不自动改变正式验收','本机便签用于交接。支持导出与导入；不会上传GitHub，不是在线多人协作。不要填写账号密码、密钥或真人敏感资料。')+`
<div class="toolbar"><button class="btn dark" id="exportNotes">导出本机记录</button><button class="btn" id="importNotes">导入记录</button><button class="btn" data-template="notes">空白JSON模板</button><span class="small" id="noteCount">本机 ${notes.length} 条</span></div><div class="storage-line" id="storageState">${storeOK?'当前浏览器支持本机保存；换设备、换浏览器不会自动同步。':'当前环境无法持久保存，仅在本次会话中保留；离开前请导出。'}</div>
<div class="card"><form id="recordForm" class="record-form"><div class="field-grid"><div><label for="recTask">关联原任务</label><select class="filter" style="width:100%" id="recTask" name="task_id">${D.tasks.map(t=>`<option value="${t.id}">${t.id} · ${esc(t.title)}</option>`).join('')}</select></div><div><label for="recRoute">关联业务（可空）</label><select class="filter" style="width:100%" id="recRoute" name="route_id"><option value="">环境或共用工作</option>${D.routes.map(x=>`<option value="${x.id}">${x.id} · ${esc(x.name)}</option>`).join('')}</select></div></div>
<div class="field-grid"><div><label for="recKind">记录类型</label><select class="filter" style="width:100%" id="recKind" name="kind">${kinds.map(x=>`<option>${x}</option>`).join('')}</select></div><div><label for="recStatus">实际工作状态</label><select class="filter" style="width:100%" id="recStatus" name="status">${statuses.map(x=>`<option>${x}</option>`).join('')}</select></div></div>
<div class="field-grid"><div><label for="recOwner">当前主办</label><select class="filter" style="width:100%" id="recOwner" name="owner">${roles.map(x=>`<option>${x}</option>`).join('')}</select></div><div><label for="recPriority">问题等级</label><select class="filter" style="width:100%" id="recPriority" name="priority">${['无',...levels.filter(x=>x!=='无')].map(x=>`<option>${x}</option>`).join('')}</select></div></div>
<div class="field-grid"><div><label for="recSha">实际后端完整提交号</label><input class="filter" style="width:100%" id="recSha" name="candidate_sha" value="${D.meta.sha}" maxlength="40" required></div><div><label for="recFront">实际前端完整提交号（验证通过必填）</label><input class="filter" style="width:100%" id="recFront" name="frontend_commit" maxlength="40" placeholder="40位commit；尚未运行则留空"></div></div>
<label for="recRef">测试业务记录</label><input class="filter" id="recRef" name="record_ref" placeholder="合成订单/申请/批次编号，不含个人信息" maxlength="1000">
<label for="recSummary">实际完成或遇到的问题</label><textarea class="filter" id="recSummary" name="summary" maxlength="6000" required placeholder="写具体动作、预期与结果，不只写已完成或继续完善。"></textarea>
<div class="field-grid"><div><label for="recEvidence">证据位置（验证通过必填）</label><input class="filter" style="width:100%" id="recEvidence" name="evidence" maxlength="3000" placeholder="仓库相对路径/测试记录"></div><div><label for="recReviewer">实际复核人（验证通过必填）</label><input class="filter" style="width:100%" id="recReviewer" name="reviewer" maxlength="200" placeholder="未复核则留空"></div></div>
<label for="recNext">最后缺项与下一动作</label><textarea class="filter" id="recNext" name="next_action" maxlength="3000" placeholder="谁做什么，什么条件满足后继续；不需要则写已转下一条。"></textarea>
<p class="small">“本条隔离验证通过”仍不是正式验收PASS；真实服务、设备和原审阅要求继续保留。</p><div class="form-error" id="formError" role="alert"></div><button class="btn dark" type="submit">保存本机工作记录</button></form></div><h3 class="section-space">本机记录</h3><div id="notesList" class="record-list grow">${recordItems()}</div>`;}
function scope(){return head('范围与依据','一个需求范围，一套正式记录','本轮只调整执行方式和顺序。正式任务、验收与当前状态继续在仓库维护，驾驶舱按请求导出更新。')+`
<div class="grid2"><article class="card"><h3>当前版本</h3><div class="keyline"><strong>后端候选</strong><span class="mono">${D.meta.sha}</span></div><div class="keyline"><strong>共同版本</strong><span class="mono">${D.meta.integration}</span></div><div class="keyline"><strong>接口 / 迁移</strong><span>${D.meta.contract} / ${D.meta.migration}</span></div><div class="keyline"><strong>前端当前构建</strong><span>由前端实际回执，不由后端报告替代</span></div></article><article class="card"><h3>本轮没有执行的事项</h3>${ul(['未修改远端代码、任务状态或正式验收。','未运行项目业务测试、合并、部署或真实服务。','未更改项目总览，也没有恢复自动监测。','未提供新上线日期；旧工时估算不作为当前倒计时。'])}</article></div>
<article class="card section-space"><h3>从PM02到本轮的变化</h3>${ul(D.changes)}</article><h3 class="section-space">原30个范围模块 · 121个要点</h3><p class="small grow">继承索引，不是本轮新增121项需求，也不代表全部重新验过。具体有效预期继续读取原正式登记。</p>${D.coverage_index.map(c=>`<details class="history"><summary>${esc(c.id)} · ${esc(c.name)} <span class="small">${c.points.length}个要点</span></summary>${ul(c.points.map(x=>x.id+' '+x.name))}</details>`).join('')}
<h3 class="section-space">来源与适用范围</h3>${D.sources.map(s=>`<article class="source-row"><div class="row-head"><h4>${esc(s.name)}</h4>${badge(s.kind)}</div><p>${esc(s.scope)}</p>${s.url?source([s.id]):''}</article>`).join('')}
<div class="button-row"><button class="btn" data-doc="rules">统一推进规则</button><button class="btn" data-doc="boundary">本轮核验边界</button></div>`;}
const renderers={home,ready,routes,tasks,issues,acceptance,services,records,scope};
function render(){document.getElementById('nav').innerHTML=tabs.map(([id,label])=>`<button type="button" class="nav-btn" data-tab="${id}" ${tab===id?'aria-current="page"':''}>${label}</button>`).join('');document.getElementById('content').innerHTML=renderers[tab]()+footer();}
function changeTab(id){if(!renderers[id])return;tab=id;render();try{history.replaceState(null,'','#'+id);}catch(e){}window.scrollTo(0,0);}
function refreshRecords(){document.getElementById('notesList').innerHTML=recordItems();document.getElementById('noteCount').textContent='本机 '+notes.length+' 条';document.getElementById('storageState').textContent=storeOK?'已保存到当前浏览器；交接前请导出，不会自动同步。':'仅本次会话保存；离开前请导出。';}
function importPayload(o){
 if(!o||typeof o!=='object'||Array.isArray(o)||Object.keys(o).some(k=>!['schema_version','candidate_sha','exported_at','records'].includes(k))||o.schema_version!=='jx.pm03.worklog.v1'||!Array.isArray(o.records)||o.records.length>500||!/^[a-f0-9]{40}$/.test(o.candidate_sha||''))throw Error('不是有效的PM03工作记录文件。');
 const arr=o.records.map(validateRecord),map=new Map(notes.map(x=>[x.id,x]));let added=0;
 for(const n of arr){if(map.has(n.id)){if(JSON.stringify(map.get(n.id))!==JSON.stringify(n))throw Error('相同记录编号内容冲突；未导入，请先核对。');}else{map.set(n.id,n);added++;}}
 if(map.size>500)throw Error('本机记录超过500条，请先归档。');
 notes=[...map.values()];persist();if(tab==='records')refreshRecords();return added;
}
document.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.tab){changeTab(b.dataset.tab);return;}
 if(b.hasAttribute('data-print')){window.print();return;}
 if(b.dataset.route){routeModal(b.dataset.route);return;}
 if(b.dataset.task){taskModal(b.dataset.task);return;}
 if(b.dataset.doc){documentModal(b.dataset.doc);return;}
 if(b.dataset.copydoc){try{await navigator.clipboard.writeText(DOC[b.dataset.copydoc].text);notify('指令已复制。');}catch(e){const t=document.getElementById('docText'),s=window.getSelection(),range=document.createRange();range.selectNodeContents(t);s.removeAllRanges();s.addRange(range);notify('已选中文本，请使用复制命令。');}return;}
 if(b.dataset.downloaddoc){download(DOC[b.dataset.downloaddoc].filename,DOC[b.dataset.downloaddoc].text,'text/plain;charset=utf-8');return;}
 if(b.dataset.startnote){const id=b.dataset.startnote,rt=b.dataset.noteRoute||'';closeModal();changeTab('records');document.getElementById('recTask').value=id;document.getElementById('recRoute').value=rt;document.getElementById('recSummary').focus();return;}
 if(b.dataset.template){const v=b.dataset.template==='env'?D.environment_schema:D.record_template;download(b.dataset.template==='env'?'联调环境交接模板.json':'PM03工作记录空白模板.json',JSON.stringify(v,null,2));return;}
 if(b.id==='exportNotes'){download('PM03工作记录_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({schema_version:'jx.pm03.worklog.v1',candidate_sha:D.meta.sha,exported_at:new Date().toISOString(),records:notes},null,2));return;}
 if(b.id==='importNotes'){document.getElementById('importFile').click();return;}
 if(b.dataset.remove){if(confirm('只删除这条本机工作记录？不会影响仓库。')){notes=notes.filter(x=>x.id!==b.dataset.remove);persist();refreshRecords();}return;}
});
document.addEventListener('input',e=>{if(e.target.id==='routeSearch'){routeQ=e.target.value;document.getElementById('routeList').innerHTML=routeCards();}if(e.target.id==='taskSearch'){taskQ=e.target.value;document.getElementById('taskList').innerHTML=taskRows();}});
document.addEventListener('change',e=>{if(e.target.id==='routeStage'){routeStage=e.target.value;document.getElementById('routeList').innerHTML=routeCards();}if(e.target.id==='taskStage'){taskStage=e.target.value;document.getElementById('taskList').innerHTML=taskRows();}if(e.target.id==='taskRole'){taskRole=e.target.value;document.getElementById('taskList').innerHTML=taskRows();}});
document.addEventListener('submit',e=>{if(e.target.id!=='recordForm')return;e.preventDefault();try{if(notes.length>=500)throw Error('已达500条，请先导出归档。');const form=Object.fromEntries(new FormData(e.target));const n=validateRecord({id:globalThis.crypto?.randomUUID?.()||('note-'+Date.now()+'-'+Math.random().toString(36).slice(2)),created_at:new Date().toISOString(),...form});notes.push(n);persist();refreshRecords();document.getElementById('formError').textContent='';notify('已保存本机记录；正式验收状态未改变。');}catch(err){document.getElementById('formError').textContent=err.message;}});
document.getElementById('importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>5*1024*1024)throw Error('文件超过5MB。');const count=importPayload(JSON.parse(await f.text()));notify('已导入 '+count+' 条；相同记录已去重，正式统计不变。');}catch(err){notify('未导入：'+err.message);}finally{e.target.value='';}});
document.getElementById('closeDetail').addEventListener('click',closeModal);
document.getElementById('detail').addEventListener('close',()=>{if(focusBack?.isConnected)focusBack.focus();});
loadNotes();if(renderers[location.hash.slice(1)])tab=location.hash.slice(1);render();
</script></body></html>
