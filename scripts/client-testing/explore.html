<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晶选片场 · 甲方测试</title><link rel="stylesheet" href="/__test/style.css"><script src="/__test/explore-client.js" defer></script></head><body>
<header><strong>晶选片场 · 共同验收</strong><span id="identity">隔离测试，非正式业务</span><button id="logout" hidden>重新进入</button></header>
<p id="message" role="status" aria-live="polite"></p>
<main id="main" hidden><section id="controls"><button id="personas">切换体验身份</button><button id="feedback">反馈当前问题</button><button id="showIssues">我的反馈</button></section><p id="instructions">模拟体验：不收费，不采集真实人脸；业务资料由体验者共同使用，请勿填写真实隐私。</p><iframe id="app" title="晶选片场" hidden></iframe><section id="issues" hidden><h2>我的反馈</h2><label>查找问题<input id="filter" placeholder="编号、描述"></label><button id="refresh">刷新进度</button><button id="backToApp">继续操作</button><div id="issueList"></div><div id="resultList" hidden></div><button id="export" hidden>导出</button></section></main>
<dialog id="personaDialog"><h2>选择体验身份</h2><p>这些是预置的模拟账号，不是您本人的实名身份。切换前请保存当前表单；同一人的个人、机构身份仍从产品内切换。</p><div id="personaList"></div><button data-close="personaDialog">返回</button></dialog>
<dialog id="simulationDialog"><h2 id="simulationTitle"></h2><p id="simulationDescription"></p><div id="simulationActions"></div><p>这里只改变模拟业务的测试状态，不会扣款、退款、调用摄像头或提交人脸。</p></dialog>
<dialog id="feedbackDialog"><form id="feedbackForm"><h2>记录当前问题</h2><p>关闭本窗口会保留业务页面和本次反馈草稿。不要填写验证码、密码或真实个人资料。</p><label>问题类型<select id="category"><option value="BUG">功能出错</option><option value="CONFUSING">流程看不懂</option><option value="REQUIREMENT">与需求不符</option><option value="SUGGESTION">改进建议</option></select></label><label>发生了什么？<textarea id="description" minlength="3" maxlength="3000" required></textarea></label><label>希望怎样？<textarea id="expected" maxlength="2000"></textarea></label><label>相关测试订单／项目编号（可不填）<input id="reference" maxlength="100"></label><p id="context"></p><label>补充截图（PNG/JPEG，最大2MB）<input id="attachment" type="file" accept="image/png,image/jpeg"></label><img id="imagePreview" alt="待提交截图" hidden><label><input id="imageConfirmed" type="checkbox">我已检查截图，不含密码、验证码或真实个人资料</label><p id="feedbackMessage" role="status"></p><button type="submit">提交问题</button><button type="button" data-close="feedbackDialog">返回继续测试</button></form></dialog>

</body></html>
