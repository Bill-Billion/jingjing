<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晶选片场 · 甲方测试</title><link rel="stylesheet" href="/__test/style.css"><script src="/__test/client.js" defer></script></head><body>
<header><strong>晶选片场 · 共同验收</strong><span id="identity">隔离测试，非正式业务</span><button id="logout" hidden>退出测试</button></header>
<p id="message" role="status" aria-live="polite"></p>
<form id="login"><h1>打开您的测试工作台</h1><p>请输入负责人单独提供的邀请码。只使用模拟资料，不上传真实证件或私人故事。</p><label>测试邀请码<input id="code" type="password" autocomplete="off" required maxlength="100"></label><button>进入测试</button></form>
<main id="main" hidden><section id="controls"><label>本次要检查的流程<select id="scenario"></select></label><button id="start">打开流程</button><button id="feedback">反馈当前问题</button><button id="showIssues">我的问题与进度</button><button id="showResult">记录本次测试结果</button><button id="export" hidden>导出问题和测试记录</button></section><p id="instructions"></p><iframe id="app" title="业务测试页面" hidden></iframe><section id="issues" hidden><h2>问题与测试记录</h2><label>查找问题<input id="filter" placeholder="编号、描述或报告人"></label><button id="refresh">刷新进度</button><div id="issueList"></div><h3>流程测试记录</h3><div id="resultList"></div></section></main>
<dialog id="feedbackDialog"><form id="feedbackForm"><h2>记录当前问题</h2><p>关闭本窗口会保留业务页面和本次反馈草稿。不要填写验证码、密码或真实个人资料。</p><label>问题类型<select id="category"><option value="BUG">功能出错</option><option value="CONFUSING">流程看不懂</option><option value="REQUIREMENT">与需求不符</option><option value="SUGGESTION">改进建议</option></select></label><label>发生了什么？<textarea id="description" minlength="3" maxlength="3000" required></textarea></label><label>希望怎样？<textarea id="expected" maxlength="2000"></textarea></label><label>相关测试订单／项目编号（可不填）<input id="reference" maxlength="100"></label><p id="context"></p><label>补充截图（PNG/JPEG，最大2MB）<input id="attachment" type="file" accept="image/png,image/jpeg"></label><img id="imagePreview" alt="待提交截图" hidden><label><input id="imageConfirmed" type="checkbox">我已检查截图，不含密码、验证码或真实个人资料</label><p id="feedbackMessage" role="status"></p><button type="submit">提交问题</button><button type="button" data-close="feedbackDialog">返回继续测试</button></form></dialog>
<dialog id="resultDialog"><form id="resultForm"><h2>这条流程测试得怎样？</h2><label>结果<select id="outcome"><option value="PASSED">这条流程已走通</option><option value="BLOCKED">卡住了，尚未走通</option><option value="NEEDS_CHANGE">能走通，但需要调整</option></select></label><label>补充说明／问题编号<textarea id="resultNote" maxlength="2000"></textarea></label><p id="resultMessage" role="status"></p><button>保存结果</button><button type="button" data-close="resultDialog">继续测试</button></form></dialog>
</body></html>
